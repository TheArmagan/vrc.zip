<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>vrc.zip</title>
    <!--
      Inline so there is no second request and no 404 in the console on first load. A data: URI
      rather than a file because the daemon serves this bundle from disk and one fewer asset to
      resolve is one fewer thing to get wrong.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f5c451'/%3E%3Cpath d='M8 10h16l-11 12h11' stroke='%23151515' stroke-width='3' fill='none' stroke-linecap='square'/%3E%3C/svg%3E"
    />
    <script>
      // Applied before first paint so the shell never flashes the wrong theme.
      // Dark is the default; light is opt-in and persisted per browser profile.
      try {
        const stored = localStorage.getItem("vrcz.theme");
        document.documentElement.classList.toggle("dark", stored !== "light");
      } catch {
        /* private mode / storage disabled — keep the dark default from the markup */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
